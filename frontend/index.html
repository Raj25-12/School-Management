    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      @keyframes preloader-spin {
        0% { transform: rotate(0deg) scale(1); }
        22% { transform: rotate(90deg) scale(1.06); }
        45% { transform: rotate(180deg) scale(0.96); }
        68% { transform: rotate(270deg) scale(1.08); }
        88% { transform: rotate(340deg) scale(0.97); }
        100% { transform: rotate(360deg) scale(1); }
      }
      @keyframes preloader-pulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        22% { transform: scale(1.18); opacity: 1; }
        45% { transform: scale(0.85); opacity: 0.75; }
        68% { transform: scale(1.22); opacity: 1; }
        88% { transform: scale(0.9); opacity: 0.8; }
      }
      @keyframes preloader-dot {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
    </style>
  </head>
